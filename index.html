  단, 이 뷰어 파일 자체 및 이를 수정한 버전을 판매하거나 유료로 배포하는 것은 금지합니다.

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="SIlv">
<title>SIlv HTML Preview Viewer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#0c0e13;
  --panel:#14161f;
  --panel2:#1a1d28;
  --line:rgba(255,255,255,.07);
  --line2:rgba(255,255,255,.12);
  --text:#e9ebf3;
  --muted:#8d93a6;
  --point:#7fd9c4;
  --point-strong:#57c2a8;
  --accent2:#b9a3ff;
  --warn:#ff9c8d;
  --caution:#e6c06a;
  --mono:"Cascadia Mono","Consolas","D2Coding",monospace;
  --shadow:0 14px 36px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:radial-gradient(circle at 18% 0%,rgba(127,217,196,.08),transparent 32%),radial-gradient(circle at 90% 10%,rgba(185,163,255,.07),transparent 34%),var(--bg);
  color:var(--text);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
button,input,select,textarea{font:inherit}
button{
  border:1px solid var(--line);
  color:var(--text);
  background:rgba(255,255,255,.04);
  padding:6px 10px;
  border-radius:9px;
  font-size:12px;
  cursor:pointer;
  transition:.15s ease;
  white-space:nowrap;
}
button:hover{border-color:rgba(127,217,196,.45);background:rgba(127,217,196,.06)}
button.danger:hover{border-color:rgba(255,156,141,.7);color:var(--warn);background:rgba(255,156,141,.08)}
button.on{color:#0b1c17;border-color:var(--point-strong);background:linear-gradient(180deg,var(--point),var(--point-strong));font-weight:600}
input[type="text"],input[type="number"],select{
  min-height:30px;
  border:1px solid var(--line);
  background:rgba(6,7,11,.6);
  color:var(--text);
  border-radius:9px;
  padding:5px 9px;
  outline:none;
  font-size:12px;
}
input:focus,select:focus{border-color:rgba(127,217,196,.45)}

/* ── 앱 골격 ── */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column}

.topbar{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 12px;
  border-bottom:1px solid var(--line);
  background:rgba(16,18,25,.92);
  backdrop-filter:blur(14px);
  position:relative;
  z-index:20;
}
.brand{display:flex;align-items:baseline;gap:6px;padding-right:6px;white-space:nowrap}
.brand b{color:var(--point-strong);font-weight:800;font-size:13.5px;letter-spacing:.03em}
.brand span{color:var(--muted);font-size:11px}
.spacer{flex:1 1 auto}
.iconBtn{min-width:32px;padding:6px 8px;font-size:13px}

.seg{display:inline-flex;padding:2px;gap:1px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.025)}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:8px;font-size:11.5px;color:var(--muted)}
.seg button:hover{color:var(--text);background:rgba(255,255,255,.04)}
.seg button.on{background:rgba(127,217,196,.14);color:var(--point);font-weight:700}

.gauge{display:flex;align-items:center;gap:8px;min-width:190px}
.gaugeBar{flex:1;min-width:70px;height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.gaugeFill{height:100%;width:0;background:var(--point);transition:width .2s ease,background .2s ease}
.gaugeText{font:11px/1 var(--mono);color:var(--muted);white-space:nowrap}
.gauge.warnZone .gaugeFill{background:var(--caution)}
.gauge.over .gaugeFill{background:var(--warn)}
.gauge.over .gaugeText{color:var(--warn)}
.gauge.noLimit{min-width:0}
.gauge.noLimit .gaugeBar{display:none}

.lintBadge{font-size:11.5px}
.lintBadge.ok{color:var(--point);border-color:rgba(127,217,196,.25)}
.lintBadge.bad{color:var(--warn);border-color:rgba(255,156,141,.4);background:rgba(255,156,141,.08)}

.main{
  flex:1 1 auto;
  min-height:0;
  display:grid;
  grid-template-columns:var(--split,44%) 12px minmax(0,1fr);
  padding:10px;
}
.pane{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:rgba(20,22,31,.9);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.divider{display:flex;align-items:center;justify-content:center;cursor:col-resize;touch-action:none}
.divider::before{content:'';width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.22);box-shadow:0 -9px 0 rgba(255,255,255,.22),0 9px 0 rgba(255,255,255,.22)}
.divider:hover::before,body.dragging .divider::before{background:var(--point);box-shadow:0 -9px 0 var(--point),0 9px 0 var(--point)}
body.dragging{cursor:col-resize;user-select:none}
body.dragging iframe{pointer-events:none}

body[data-view="code"] .main,body[data-view="preview"] .main{grid-template-columns:minmax(0,1fr)}
body[data-view="code"] .divider,body[data-view="code"] .previewPane{display:none}
body[data-view="preview"] .divider,body[data-view="preview"] .editorPane{display:none}

/* ── 에디터 ── */
textarea{
  flex:1 1 auto;
  display:block;
  width:100%;
  min-height:0;
  resize:none;
  border:0;
  outline:none;
  padding:16px;
  color:#eef1f8;
  background:#0d1018;
  line-height:1.55;
  font-family:var(--mono);
  font-size:13px;
  tab-size:2;
  overflow:auto;
}
textarea::selection{background:#315fdb;color:#fff}
.editorFoot{
  flex:0 0 auto;
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:6px 12px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font:11px/1.3 var(--mono);
}

/* ── 미리보기 ── */
.pvBar{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 10px;
  border-bottom:1px solid var(--line);
  overflow-x:auto;
  white-space:nowrap;
}
.pvBar .lbl{color:var(--muted);font-size:11px;padding-left:2px}
.wNum{width:72px;font-family:var(--mono)!important}
.previewWrap{flex:1 1 auto;min-height:0;overflow:auto;padding:20px 20px 60px}
.previewWrap.checker{
  background-color:#ddd!important;
  background-image:linear-gradient(45deg,#bbb 25%,transparent 25%),linear-gradient(-45deg,#bbb 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#bbb 75%),linear-gradient(-45deg,transparent 75%,#bbb 75%)!important;
  background-size:24px 24px!important;
  background-position:0 0,0 12px,12px -12px,-12px 0!important;
}
.device{
  box-sizing:content-box;
  width:760px;
  margin:0 auto;
  border:1px dashed rgba(255,255,255,.14);
  border-radius:12px;
  transition:width .18s ease;
}
.device.full{width:calc(100% - 2px)}
.device iframe{display:block;width:100%;height:240px;border:0;background:transparent;border-radius:12px}

.selBar{
  flex:0 0 auto;
  display:none;
  align-items:center;
  gap:6px;
  padding:7px 10px;
  border-top:1px solid var(--line);
  background:rgba(127,217,196,.04);
  overflow-x:auto;
  white-space:nowrap;
}
.selBar.show{display:flex}
.selInfo{flex:1 1 auto;min-width:80px;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:11.5px}
.selInfo b{color:var(--point);font-family:var(--mono);font-weight:700}
.chip{padding:5px 10px;border-radius:999px;font-size:11.5px}
.chip.x{padding:5px 9px;color:var(--muted)}
.onlyMobile{display:none}

/* ── 팝오버 (스니펫 / 검사) ── */
.backdrop{position:fixed;inset:0;z-index:50;display:none;background:rgba(4,6,10,.4);backdrop-filter:blur(2px)}
.backdrop.show{display:block}
.backdrop.light{background:transparent;backdrop-filter:none}
.pop{
  position:fixed;
  z-index:60;
  display:none;
  flex-direction:column;
  width:340px;
  max-height:min(70vh,520px);
  background:#191c26;
  border:1px solid var(--line2);
  border-radius:14px;
  box-shadow:0 24px 70px rgba(0,0,0,.55);
  overflow:hidden;
}
.pop.open{display:flex}
.popHead{flex:0 0 auto;padding:10px;border-bottom:1px solid var(--line)}
.popHead input{width:100%}
.popTitle{font-size:12px;color:var(--muted)}
.popBody{flex:1 1 auto;overflow:auto;padding:4px 6px 10px}
.popFoot{flex:0 0 auto;display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}
.popFoot button{flex:1}
.grpTitle{padding:12px 8px 4px;color:var(--muted);font-size:10.5px;letter-spacing:.16em}
.snipItem{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 10px;
  border-radius:9px;
  cursor:pointer;
  transition:.12s ease;
}
.snipItem:hover,.snipItem.first{background:rgba(127,217,196,.08)}
.snipItem .nm{flex:0 0 auto;font-size:12.5px}
.snipItem .hint{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font:10.5px/1.3 var(--mono)}
.snipItem.dim{opacity:.4}
.snipItem.dim .nm::after{content:' · 이 플랫폼 금지';color:var(--warn);font-size:10.5px}
.snipItem .del{flex:0 0 auto;padding:2px 7px;font-size:11px;color:var(--muted)}
.emptyHint{padding:6px 10px 2px;color:var(--muted);font-size:11.5px;line-height:1.5}
.lintItem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer}
.lintItem:hover{background:rgba(255,156,141,.07)}
.lintItem .msg{flex:1 1 auto;font-size:12.5px;line-height:1.45}
.lintItem .cnt{flex:0 0 auto;color:var(--warn);font:11px var(--mono)}
.lintOk{padding:16px 10px;color:var(--point);font-size:12.5px;text-align:center}

/* ── 도구 서랍 ── */
.drawer{
  position:fixed;
  z-index:70;
  top:0;
  right:0;
  bottom:0;
  width:min(370px,92vw);
  padding:6px 16px 20px;
  overflow:auto;
  background:#171a23;
  border-left:1px solid var(--line2);
  box-shadow:-20px 0 60px rgba(0,0,0,.45);
  transform:translateX(105%);
  transition:transform .22s ease;
}
.drawer.open{transform:none}
.drawerHead{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:10px 0;background:#171a23;z-index:1}
.drawerHead b{font-size:13px}
.sec{padding:12px 0 14px;border-top:1px solid var(--line)}
.secT{margin-bottom:9px;color:var(--muted);font-size:10.5px;letter-spacing:.16em}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row + .row{margin-top:7px}
.row input[type="text"]{flex:1;min-width:140px}
.statsGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.03)}
.stat b{display:block;font-size:14px}
.stat span{display:block;margin-top:2px;color:var(--muted);font-size:11px}
.keys{color:var(--muted);font-size:11.5px;line-height:1.9}
kbd{display:inline-block;padding:1px 5px;border-radius:5px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#e8ecf5;font-size:10.5px;font-family:var(--mono)}

.colorField{display:inline-flex;align-items:center;gap:5px;padding:3px 8px 3px 3px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.025)}
.colorField input[type="color"]{width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.22);padding:0;overflow:hidden;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
.colorField input[type="color"]::-webkit-color-swatch-wrapper{padding:0}
.colorField input[type="color"]::-webkit-color-swatch{border:0;border-radius:50%}
.hexMini{width:70px;min-height:24px!important;border:0!important;background:transparent!important;padding:2px 0!important;text-transform:lowercase;font-family:var(--mono)!important;font-size:11.5px!important;text-align:center}
.rgbGroup{display:flex;align-items:center}
.rgbMini{width:38px;min-height:24px!important;border:0!important;border-left:1px solid var(--line)!important;border-radius:0!important;background:transparent!important;padding:2px 3px!important;font-family:var(--mono)!important;font-size:11px!important;text-align:center}

/* ── 모바일 탭바 ── */
.tabbar{display:none}

.toast{
  position:fixed;
  left:50%;
  bottom:18px;
  z-index:90;
  transform:translateX(-50%);
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--line);
  padding:8px 14px;
  border-radius:999px;
  box-shadow:var(--shadow);
  font-size:12.5px;
  opacity:0;
  pointer-events:none;
  transition:.2s ease;
}
.toast.show{opacity:1;bottom:25px}

.silvWatermark{
  position:fixed;
  right:14px;
  bottom:12px;
  z-index:5;
  display:flex;
  align-items:baseline;
  gap:4px;
  padding:4px 10px;
  border-radius:999px;
  border:1px solid rgba(127,217,196,.18);
  background:rgba(12,14,19,.55);
  color:rgba(233,235,243,.42);
  font-size:10.5px;
  font-family:var(--mono);
  letter-spacing:.06em;
  pointer-events:none;
  backdrop-filter:blur(6px);
}
.silvWatermark b{color:var(--point);font-weight:700;letter-spacing:.02em}

@media(max-width:760px){
  .topbar{flex-wrap:wrap;row-gap:6px;padding:8px 10px}
  .viewSeg,.hideMobile,.brand,.topbar .spacer{display:none}
  .topbar{gap:5px}
  .topbar button,.topbar select{min-height:36px}
  .topbar button{padding:6px 8px}
  #platform{flex:1 1 0;min-width:0}
  .gauge{order:9;flex:1 1 100%;min-width:0}
  .main{grid-template-columns:minmax(0,1fr)!important;padding:8px}
  .divider{display:none!important}
  body .editorPane,body .previewPane{display:flex!important}
  body[data-mtab="code"] .previewPane{display:none!important}
  body[data-mtab="preview"] .editorPane{display:none!important}
  textarea{font-size:16px;padding:12px}
  .previewWrap{padding:12px 10px 40px}
  .onlyMobile{display:inline-flex}
  .chip,.seg button{min-height:34px}
  .tabbar{
    display:flex;
    flex:0 0 auto;
    gap:6px;
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    background:rgba(16,18,25,.96);
  }
  .tabbar button{flex:1;min-height:42px;font-size:13px}
  .pop{left:0!important;right:0!important;top:auto!important;bottom:0;width:auto;max-height:72dvh;border-radius:16px 16px 0 0}
  .backdrop.light{background:rgba(4,6,10,.4)}
  .drawer{top:auto;left:0;width:auto;max-height:82dvh;border-left:0;border-top:1px solid var(--line2);border-radius:18px 18px 0 0;transform:translateY(105%);padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .drawer.open{transform:none}
  .silvWatermark{display:none}
}
</style>
</head>
<body data-view="split" data-mtab="code">
<div class="app">
  <header class="topbar">
    <div class="brand"><b>SIlv</b><span>HTML Preview Viewer</span></div>
    <div class="seg viewSeg" id="viewSeg">
      <button data-view="split" title="Alt+1">분할</button>
      <button data-view="code" title="Alt+2">코드</button>
      <button data-view="preview" title="Alt+3">미리보기</button>
    </div>
    <span class="spacer"></span>
    <select id="platform" title="플랫폼 기준 (글자수 · 검사 규칙)"></select>
    <div class="gauge" id="gauge" title="글자수">
      <div class="gaugeBar"><div class="gaugeFill" id="gaugeFill"></div></div>
      <span class="gaugeText" id="gaugeText">0</span>
    </div>
    <button id="lintBtn" class="lintBadge ok">검사 OK</button>
    <button id="snipBtn" title="Ctrl+K">스니펫 ▾</button>
    <button id="undoBtn" class="iconBtn" title="실행취소 (Ctrl+Z)">↶</button>
    <button id="redoBtn" class="iconBtn" title="다시실행 (Ctrl+Y)">↷</button>
    <button id="copyBtn">복사</button>
    <button id="drawerBtn" class="hideMobile">도구</button>
  </header>

  <main class="main" id="main">
    <section class="pane editorPane">
      <textarea id="code" spellcheck="false" placeholder="여기에 HTML을 붙여넣어줘."></textarea>
      <div class="editorFoot"><span id="cursorPos">줄 1 · 열 1</span><span id="saveState">자동 저장</span></div>
    </section>

    <div class="divider" id="divider" title="드래그로 폭 조절 · 더블클릭 초기화"></div>

    <section class="pane previewPane">
      <div class="pvBar">
        <span class="lbl">폭</span>
        <div class="seg" id="widthSeg"></div>
        <input id="widthNum" class="wNum" type="number" min="240" max="1600" placeholder="직접" title="직접 입력 후 Enter">
      </div>
      <div class="previewWrap" id="previewWrap">
        <div class="device" id="device"><iframe id="frame" sandbox="allow-scripts" title="미리보기"></iframe></div>
      </div>
      <div class="selBar" id="selBar">
        <span class="selInfo" id="selInfo"></span>
        <button class="chip" data-mode="exact">이 태그</button>
        <button class="chip" data-mode="parent1">부모</button>
        <button class="chip" data-mode="parent2">큰 부모</button>
        <button class="chip onlyMobile" id="gotoCode">코드 보기</button>
        <button class="chip x" id="selClose" title="선택 해제">✕</button>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button data-tab="code">코드</button>
    <button data-tab="preview">미리보기</button>
    <button id="tabTools">도구</button>
  </nav>
</div>

<div class="backdrop" id="backdrop"></div>

<div class="pop" id="snipPop">
  <div class="popHead"><input id="snipSearch" type="text" placeholder="스니펫 검색 · Enter로 첫 항목 삽입" autocomplete="off"></div>
  <div class="popBody" id="snipBody"></div>
  <div class="popFoot"><button id="snipSave">+ 선택 영역 저장</button></div>
</div>

<div class="pop" id="lintPop">
  <div class="popHead"><span class="popTitle" id="lintTitle">검사 결과</span></div>
  <div class="popBody" id="lintBody"></div>
</div>

<aside class="drawer" id="drawer">
  <div class="drawerHead"><b>도구</b><button id="drawerClose" class="chip x">✕</button></div>

  <div class="sec">
    <div class="secT">편집</div>
    <div class="row">
      <button id="sampleBtn">샘플</button>
      <button id="minifyBtn">한줄압축</button>
      <button id="beautyBtn">줄바꿈</button>
      <button id="clearBtn" class="danger">비우기</button>
    </div>
  </div>

  <div class="sec">
    <div class="secT">미리보기 배경</div>
    <div class="row">
      <button class="presetBg" data-bg="#ffffff">White</button>
      <button class="presetBg" data-bg="#f3ead7">Ivory</button>
      <button class="presetBg" data-bg="#11151d">Dark</button>
      <button class="presetBg" data-bg="#18251f">Forest</button>
      <button class="presetBg" data-bg="#777b82">Grey</button>
      <button id="checkerBtn">체크무늬</button>
    </div>
    <div class="row">
      <span class="colorField"><input id="bgColor" type="color" value="#11151d" title="배경색"><input id="bgHex" class="hexMini" value="#11151d" title="배경색 Hex"><span class="rgbGroup" title="배경색 RGB"><input id="bgR" class="rgbMini" type="number" min="0" max="255" value="17"><input id="bgG" class="rgbMini" type="number" min="0" max="255" value="21"><input id="bgB" class="rgbMini" type="number" min="0" max="255" value="29"></span></span>
    </div>
    <div class="row">
      <input id="bgImage" type="text" placeholder="배경 이미지 URL">
      <select id="bgMode">
        <option value="cover">cover</option>
        <option value="contain">contain</option>
        <option value="repeat">repeat</option>

      <kbd>Alt</kbd>+<kbd>1</kbd>/<kbd>2</kbd>/<kbd>3</kbd> 분할/코드/미리보기 · <kbd>Esc</kbd> 닫기<br>

<script>
const $=id=>document.getElementById(id);
const code=$('code');
const frame=$('frame');
const device=$('device');
const previewWrap=$('previewWrap');
const toast=$('toast');

const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,v);}catch(e){}}
};
const mq=window.matchMedia('(max-width:760px)');
const isMobile=()=>mq.matches;

let toastTimer=null;
function showToast(msg='완료'){
  toast.textContent=msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove('show'),1100);
}

/* ───────── 플랫폼 프리셋 ───────── */
const CD_ALLOWED=new Set(['div','p','span','b','i','strong','em','a','br','hr','img']);
const PLATFORMS={
  'cd-intro':{label:'케덕 소개창',limit:15000,rules:['whitelist','quote','userAttr','imgSrc']},
  'cd-creator':{label:'케덕 크리에이터',limit:30000,rules:['whitelist','quote','userAttr','imgSrc']},
  'cd-widget':{label:'케덕 위젯',limit:0,rules:['quote','userAttr','imgSrc','keyframes','detailsName']},
  'umai-intro':{label:'우마이 소개창',limit:100000,rules:['anchor']}
};
let platform=LS.get('silv_viewer_platform','cd-intro');
if(!PLATFORMS[platform])platform='cd-intro';

/* ───────── 실행취소 / 다시실행 ───────── */
let undoStack=[];
let redoStack=[];
let isApplyingHistory=false;
let isProgrammaticEdit=false;
let lastPushTime=0;
let lastKind='';
const HISTORY_LIMIT=240;

function snapshot(){
  return {value:code.value,start:code.selectionStart??0,end:code.selectionEnd??0,scroll:code.scrollTop??0};
}
function pushUndo(){
  if(isApplyingHistory)return;
  const snap=snapshot();
  const last=undoStack[undoStack.length-1];
  if(!(last && last.value===snap.value)){
    undoStack.push(snap);
    if(undoStack.length>HISTORY_LIMIT)undoStack.shift();
  }
  redoStack=[];
  updateHistoryButtons();
}
function applySnapshot(snap){
  if(!snap)return;
  isApplyingHistory=true;
  code.value=snap.value;
  renderNow();
  scheduleSave();
  if(!isMobile()||document.body.dataset.mtab==='code'){
    code.focus({preventScroll:true});
    code.setSelectionRange(snap.start,snap.end);
    code.scrollTop=snap.scroll;
  }
  isApplyingHistory=false;
  lastKind='';
  updateHistoryButtons();
}
function undoAction(){
  if(!undoStack.length)return;
  redoStack.push(snapshot());
  applySnapshot(undoStack.pop());
  showToast('실행취소');
}
function redoAction(){
  if(!redoStack.length)return;
  undoStack.push(snapshot());
  applySnapshot(redoStack.pop());
  showToast('다시실행');
}
function updateHistoryButtons(){
  $('undoBtn').style.opacity=undoStack.length?'1':'.4';
  $('redoBtn').style.opacity=redoStack.length?'1':'.4';
}
function commitProgrammaticEdit(mutator){
  pushUndo();
  isProgrammaticEdit=true;
  mutator();
  isProgrammaticEdit=false;
  lastKind='';
  renderNow();
  scheduleSave();
  updateHistoryButtons();
}

code.addEventListener('beforeinput',e=>{
  if(isApplyingHistory||isProgrammaticEdit)return;
  const type=e.inputType||'';
  if(type==='historyUndo'||type==='historyRedo'){
    e.preventDefault();
    if(type==='historyUndo')undoAction();else redoAction();
    return;
  }
  const kind=type.startsWith('delete')?'del':(type==='insertText'?'ins':'other');
  const now=Date.now();
  if(kind==='other'||kind!==lastKind||now-lastPushTime>800||code.selectionStart!==code.selectionEnd){
    pushUndo();
  }else{
    redoStack=[];
  }
  lastPushTime=now;
  lastKind=kind;
});
code.addEventListener('input',()=>{
  if(isApplyingHistory||isProgrammaticEdit)return;
  scheduleRender();
  scheduleSave();
  updateHistoryButtons();
});
code.addEventListener('keydown',e=>{
  const key=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&key==='z'){e.preventDefault();undoAction();}
  else if((e.ctrlKey||e.metaKey)&&(key==='y'||(e.shiftKey&&key==='z'))){e.preventDefault();redoAction();}
});
$('undoBtn').addEventListener('click',undoAction);
$('redoBtn').addEventListener('click',redoAction);

/* 커서 위치 */
function updateCursorPos(){
  const pos=code.selectionStart||0;
  const before=code.value.slice(0,pos);
  const line=before.split('\n').length;
  const col=pos-before.lastIndexOf('\n');
  $('cursorPos').textContent=`줄 ${line} · 열 ${col}`;
}
['keyup','click','select','input'].forEach(ev=>code.addEventListener(ev,updateCursorPos));

/* 자동 저장 */
let saveTimer=null;
function scheduleSave(){
  clearTimeout(saveTimer);
  $('saveState').textContent='저장 중…';
  saveTimer=setTimeout(()=>{
    LS.set('silv_viewer_code',code.value);
    const d=new Date();
    $('saveState').textContent=`저장됨 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  },600);
}

/* ───────── 소스 매핑 ───────── */
const voidTags=new Set(['area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr']);
const rawTextTags=new Set(['script','style','textarea','title']);
let sourceMap=new Map();
let annotated='';

function findTagEnd(str,start){
  let quote=null;
  for(let i=start;i<str.length;i++){
    const ch=str[i];
    if(quote){if(ch===quote)quote=null;}
    else if(ch==='"'||ch==="'")quote=ch;
    else if(ch==='>')return i;
  }
  return -1;
}
function getTagName(content){
  const clean=content.trim().replace(/^\//,'');
  const m=clean.match(/^([a-zA-Z][\w:-]*)/);
  return m?m[1].toLowerCase():'';
}
function annotateHTML(raw){
  sourceMap=new Map();
  let out='';
  let i=0;
  let id=1;
  const stack=[];
  while(i<raw.length){
    if(raw.startsWith('<!--',i)){
      const end=raw.indexOf('-->',i+4);
      const stop=end>-1?end+3:raw.length;
      out+=raw.slice(i,stop);
      i=stop;
      continue;
    }
    if(raw[i]!=='<'){
      const nx=raw.indexOf('<',i);
      const stop=nx===-1?raw.length:nx;
      out+=raw.slice(i,stop);
      i=stop;
      continue;
    }
    const end=findTagEnd(raw,i+1);
    if(end===-1){out+=raw.slice(i);break;}
    const tagRaw=raw.slice(i,end+1);
    const trimmed=raw.slice(i+1,end).trim();
    if(trimmed.startsWith('!')||trimmed.startsWith('?')){out+=tagRaw;i=end+1;continue;}
    if(trimmed.startsWith('/')){
      const name=getTagName(trimmed);
      for(let s=stack.length-1;s>=0;s--){
        if(stack[s].tag===name){
          const item=stack.splice(s,1)[0];
          item.end=end+1;
          sourceMap.set(String(item.id),item);
          break;
        }
      }
      out+=tagRaw;
      i=end+1;
      continue;
    }
    const tag=getTagName(trimmed);
    if(!tag){out+=tagRaw;i=end+1;continue;}
    const selfClosing=/\/\s*$/.test(trimmed)||voidTags.has(tag);
    const kid=id++;
    const parent=stack.length?stack[stack.length-1].id:null;
    out+=/\/\s*>$/.test(tagRaw)
      ?tagRaw.replace(/\s*\/\s*>$/,` data-kangi-id="${kid}"/>`)
      :tagRaw.slice(0,-1)+` data-kangi-id="${kid}">`;
    const item={id:kid,tag,start:i,end:end+1,parent};
    i=end+1;
    if(selfClosing){sourceMap.set(String(kid),item);continue;}
    if(rawTextTags.has(tag)){
      const re=new RegExp('</'+tag+'\\s*>','ig');
      re.lastIndex=i;
      const cm=re.exec(raw);
      const cEnd=cm?cm.index+cm[0].length:raw.length;
      out+=raw.slice(i,cEnd);
      item.end=cEnd;
      sourceMap.set(String(kid),item);
      i=cEnd;
      continue;
    }
    stack.push(item);
  }
  while(stack.length){
    const item=stack.pop();
    item.end=raw.length;
    sourceMap.set(String(item.id),item);
  }
  return out;
}

/* ───────── 미리보기 iframe ───────── */
function bridge(){
  var root=document.getElementById('root');
  var lastH=-1;
  function post(d){d.__silv=1;parent.postMessage(d,'*');}
  function report(){
    var h=Math.ceil(root.getBoundingClientRect().height);
    if(h!==lastH){lastH=h;post({type:'h',h:h});}
  }
  if(window.ResizeObserver)new ResizeObserver(report).observe(root);
  window.addEventListener('load',report);
  document.addEventListener('load',report,true);
  window.addEventListener('message',function(e){
    if(e.source!==parent)return;
    var d=e.data||{};
    if(d.type==='html'){root.innerHTML=d.html;report();}
    else if(d.type==='env'){
      var h=document.documentElement;
      h.classList.toggle('k-force',!!d.force);
      h.style.setProperty('--k-fc',d.color||'#fff');
      h.classList.toggle('k-pause',!!d.pause);
    }else if(d.type==='mark'){
      var old=root.querySelectorAll('.k-sel,.k-par');
      for(var i=0;i<old.length;i++)old[i].classList.remove('k-sel','k-par');
      if(d.id){
        var n=root.querySelector('[data-kangi-id="'+d.id+'"]');
        if(n)n.classList.add(d.kind==='exact'?'k-sel':'k-par');
      }
    }
  });
  document.addEventListener('click',function(e){
    var t=e.target;
    if(!t||!t.closest)return;
    if(t.closest('a'))e.preventDefault();
    var el=t.closest('[data-kangi-id]');
    if(!el)return;
    var mode=e.altKey?'parent2':(e.shiftKey?'parent1':'exact');
    var text=(el.innerText||el.getAttribute('alt')||'').replace(/\s+/g,' ').trim().slice(0,40);
    post({type:'select',id:el.getAttribute('data-kangi-id'),mode:mode,text:text});
  });
  post({type:'ready'});
}
function buildSrcdoc(){
  const font='https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css';
  const css=
    'html,body{margin:0;background:transparent;}'+
    'body{color:#e9ebf3;font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;}'+
    '#root{display:flow-root;min-height:40px;}'+
    '.k-sel{outline:2px solid #7fd9c4!important;outline-offset:-2px!important;}'+
    '.k-par{outline:2px dashed #b9a3ff!important;outline-offset:-2px!important;}'+
    'html.k-force #root *{color:var(--k-fc)!important;}'+
    'html.k-pause *,html.k-pause *::before,html.k-pause *::after{animation-play-state:paused!important;transition:none!important;}';
  return '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+
    '<link rel="stylesheet" href="'+font+'"><style>'+css+'</style></head><body><div id="root"></div>'+
    '<scr'+'ipt>('+bridge.toString()+')();</scr'+'ipt></body></html>';
}

let frameReady=false;
function post(d){if(frameReady&&frame.contentWindow)frame.contentWindow.postMessage(d,'*');}
window.addEventListener('message',e=>{
  if(e.source!==frame.contentWindow)return;
  const d=e.data;
  if(!d||!d.__silv)return;
  if(d.type==='ready'){frameReady=true;sendEnv();post({type:'html',html:annotated});}
  else if(d.type==='h'){frame.style.height=Math.max(d.h,120)+'px';}
  else if(d.type==='select'){selectFromPreview(d.id,d.mode,d.text);}
});
frame.srcdoc=buildSrcdoc();

/* ───────── 렌더 ───────── */
let renderTimer=null;
function scheduleRender(){
  clearTimeout(renderTimer);
  renderTimer=setTimeout(renderNow,160);
  updateGauge();
}
function renderNow(){
  clearTimeout(renderTimer);
  annotated=annotateHTML(code.value);
  post({type:'html',html:annotated});
  clearSelection();
  updateGauge();
  updateStats();
  updateLint();
}

function updateGauge(){
  const n=code.value.length;
  const p=PLATFORMS[platform];
  const g=$('gauge');
  g.classList.toggle('noLimit',!p.limit);
  if(!p.limit){
    g.classList.remove('over','warnZone');
    $('gaugeText').textContent=n.toLocaleString()+'자';
    return;
  }
  const ratio=n/p.limit;
  $('gaugeFill').style.width=Math.min(100,ratio*100)+'%';
  $('gaugeText').textContent=`${n.toLocaleString()} / ${p.limit.toLocaleString()}`;
  g.classList.toggle('over',ratio>1);
  g.classList.toggle('warnZone',ratio>.9&&ratio<=1);
}

function updateStats(){
  const t=document.createElement('template');
  t.innerHTML=code.value;
  const frag=t.content;
  $('htmlCount').textContent=code.value.length.toLocaleString();
  $('textCount').textContent=(frag.textContent||'').replace(/\s+/g,' ').trim().length.toLocaleString();
  $('imgCount').textContent=frag.querySelectorAll('img').length;
  $('detailCount').textContent=frag.querySelectorAll('details').length;
}

/* ───────── 검사 ───────── */
let lintItems=[];
function runLint(raw,pid){
  const rules=PLATFORMS[pid].rules;
  const has=r=>rules.includes(r);
  const out=[];
  const add=(key,msg,pos)=>{
    let it=out.find(o=>o.key===key);
    if(!it){it={key,msg,positions:[],cursor:0};out.push(it);}
    it.positions.push(pos);
  };
  const src=raw.replace(/<!--[\s\S]*?-->/g,m=>' '.repeat(m.length));
  const tagRe=/<([a-zA-Z][\w:-]*)\b(?:[^>"']|"[^"]*"|'[^']*')*>/g;
  let m;
  while((m=tagRe.exec(src))){
    const tag=m[1].toLowerCase();
    const text=m[0];
    const pos=m.index;
    if(has('whitelist')&&!CD_ALLOWED.has(tag))add('wl-'+tag,`<${tag}> 허용되지 않는 태그`,pos);
    if(has('quote')&&/\s[\w:-]+\s*=\s*'/.test(text))add('quote','홑따옴표 속성값 (쌍따옴표로 바꾸기)',pos);
    if(has('userAttr')&&/\{\{\s*user\s*\}\}/i.test(text))add('userAttr','태그 속성 안의 {{user}} (구조 깨짐)',pos);
    if(has('imgSrc')&&tag==='img'){
      const s=text.match(/\ssrc\s*=\s*(?:"([^"]*)"|'([^']*)')/);
      const v=s?(s[1]??s[2]??'').trim():'';
      if(!/^(https?:)?\/\//i.test(v)&&!/^data:/i.test(v))add('imgSrc','img src가 실제 URL이 아님',pos);
    }
    if(has('detailsName')&&tag==='details'&&/\sname\s*=/.test(text))add('detailsName','details name 배타 아코디언은 작동 안 함',pos);
    if(has('anchor')&&tag==='a'&&/\shref\s*=\s*["']#/.test(text))add('anchor','href="#id" 앵커 링크 (빈 화면으로 이동)',pos);
  }
  if(has('keyframes')){
    const re=/@keyframes/g;
    while((m=re.exec(src)))add('keyframes','커스텀 @keyframes 불가 (Animate.css 이름만)',m.index);
  }
  return out;
}
function updateLint(){
  lintItems=runLint(code.value,platform);
  const btn=$('lintBtn');
  btn.classList.toggle('ok',!lintItems.length);
  btn.classList.toggle('bad',lintItems.length>0);
  btn.textContent=lintItems.length?`경고 ${lintItems.length}`:'검사 OK';
  if($('lintPop').classList.contains('open'))renderLintList();
}
function renderLintList(){
  const body=$('lintBody');
  body.textContent='';
  $('lintTitle').textContent=`검사 결과 · ${PLATFORMS[platform].label}`;
  if(!lintItems.length){
    const ok=document.createElement('div');
    ok.className='lintOk';
    ok.textContent='걸리는 항목 없음';
    body.appendChild(ok);
    return;
  }
  lintItems.forEach(it=>{
    const row=document.createElement('div');
    row.className='lintItem';
    const msg=document.createElement('span');
    msg.className='msg';
    msg.textContent=it.msg;
    const cnt=document.createElement('span');
    cnt.className='cnt';
    cnt.textContent=`${it.positions.length}곳`;
    row.append(msg,cnt);
    row.title='클릭할 때마다 다음 위치로 이동';
    row.addEventListener('click',()=>{
      const pos=it.positions[it.cursor%it.positions.length];
      it.cursor++;
      let end=code.value[pos]==='<'?findTagEnd(code.value,pos+1)+1:pos+10;
      if(end<=pos)end=pos+1;
      closeAll();
      jumpToRange(pos,end);
    });
    body.appendChild(row);
  });
}

/* ───────── 코드 위치 이동 ───────── */
function scrollCodeToIndex(index){
  if(index<0||!code.clientWidth)return;
  const cs=getComputedStyle(code);
  const mirror=document.createElement('div');
  const marker=document.createElement('span');
  mirror.style.cssText='position:absolute;visibility:hidden;pointer-events:none;left:-99999px;top:0;white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word;';
  mirror.style.width=code.clientWidth+'px';
  mirror.style.boxSizing=cs.boxSizing;
  mirror.style.padding=cs.padding;
  mirror.style.font=cs.font;
  mirror.style.lineHeight=cs.lineHeight;
  mirror.style.letterSpacing=cs.letterSpacing;
  mirror.style.tabSize=cs.tabSize;
  marker.textContent='|';
  mirror.appendChild(document.createTextNode(code.value.slice(0,index)));
  mirror.appendChild(marker);
  mirror.appendChild(document.createTextNode(code.value.slice(index,index+1)||' '));
  document.body.appendChild(mirror);
  code.scrollTop=Math.max(0,marker.offsetTop-code.clientHeight*0.45);
  document.body.removeChild(mirror);
}
function jumpToRange(start,end){
  if(isMobile())setMobileTab('code');
  else if(document.body.dataset.view==='preview')setView('split');
  requestAnimationFrame(()=>{
    code.focus({preventScroll:true});
    code.setSelectionRange(start,end);
    scrollCodeToIndex(start);
    updateCursorPos();
  });
}

/* ───────── 미리보기 선택 ───────── */
let sel=null;
function resolveItem(id,mode){
  let it=sourceMap.get(String(id));
  if(!it)return null;
  const steps=mode==='parent1'?1:(mode==='parent2'?2:0);
  for(let s=0;s<steps;s++){
    if(it.parent==null)break;
    const p=sourceMap.get(String(it.parent));
    if(!p)break;
    it=p;
  }
  return it;
}
function selectFromPreview(id,mode,text){
  sel={baseId:id,text:text||''};
  applySelection(mode);
}
function applySelection(mode){
  if(!sel)return;
  const it=resolveItem(sel.baseId,mode);
  if(!it)return;
  sel.mode=mode;
  sel.item=it;
  post({type:'mark',id:it.id,kind:mode==='exact'?'exact':'parent'});
  const label=mode==='exact'?'':(mode==='parent1'?'부모 ':'큰 부모 ');
  const info=$('selInfo');
  info.textContent='';
  const b=document.createElement('b');
  b.textContent=`<${it.tag}>`;
  info.append(label,b,` · ${(it.end-it.start).toLocaleString()}자`);
  if(mode==='exact'&&sel.text)info.append(` · "${sel.text}"`);
  document.querySelectorAll('#selBar .chip[data-mode]').forEach(c=>c.classList.toggle('on',c.dataset.mode===mode));
  $('selBar').classList.add('show');
  if(!isMobile()&&document.body.dataset.view!=='preview'){
    code.focus({preventScroll:true});
    code.setSelectionRange(it.start,it.end);
    requestAnimationFrame(()=>scrollCodeToIndex(it.start));
    updateCursorPos();
  }
}
function clearSelection(){
  sel=null;
  $('selBar').classList.remove('show');
  post({type:'mark',id:null});
}

  {g:'이미지',name:'img',value:'<img src="https://placehold.co/600x400" alt="" style="width:100%;height:auto;display:block;">'},
  {g:'이미지',name:'사진 그라데이션 전환',value:'<div style="height:420px;background:linear-gradient(to bottom,#11151d 0%,rgba(17,21,29,0) 22%,rgba(17,21,29,0) 72%,#11151d 100%),url(https://placehold.co/800x1000) center/cover no-repeat;">§</div>'},

];

function loadCustom(){
  try{const v=JSON.parse(LS.get('silv_viewer_snips','[]'));return Array.isArray(v)?v:[];}catch(e){return [];}
}
function saveCustom(list){LS.set('silv_viewer_snips',JSON.stringify(list));}

function insertAtCursor(raw){
  const caretIdx=raw.indexOf('§');
  const text=raw.replace('§','');
  if(isMobile())setMobileTab('code');
  else if(document.body.dataset.view==='preview')setView('split');
  const start=code.selectionStart??code.value.length;
  const end=code.selectionEnd??code.value.length;
  commitProgrammaticEdit(()=>{
    code.value=code.value.slice(0,start)+text+code.value.slice(end);
  });
  const caret=start+(caretIdx>=0?caretIdx:text.length);
  requestAnimationFrame(()=>{
    code.focus({preventScroll:true});
    code.setSelectionRange(caret,caret);
    scrollCodeToIndex(caret);
    updateCursorPos();
  });
  showToast('삽입했어');
}

let visibleSnips=[];
function renderSnippetList(){
  const q=$('snipSearch').value.trim().toLowerCase();
  const body=$('snipBody');
  body.textContent='';
  visibleSnips=[];
  const custom=loadCustom().map((c,i)=>({g:'내 스니펫',name:c.name,value:c.value,ci:i}));
  const all=[...SNIPPETS,...custom];
  GROUPS.forEach(g=>{
    const items=all.filter(s=>s.g===g&&(!q||s.name.toLowerCase().includes(q)||s.value.toLowerCase().includes(q)));
    if(!items.length&&(g!=='내 스니펫'||q))return;
    const t=document.createElement('div');
    t.className='grpTitle';
    t.textContent=g;
    body.appendChild(t);
    if(!items.length){
      const h=document.createElement('div');
      h.className='emptyHint';
      h.textContent='코드에서 자주 쓰는 부분을 선택하고 아래 + 선택 영역 저장';
      body.appendChild(h);
      return;
    }
    items.forEach(s=>{
      const row=document.createElement('div');
      row.className='snipItem';
      if(s.bad&&s.bad.includes(platform))row.classList.add('dim');
      if(!visibleSnips.length)row.classList.add('first');
      visibleSnips.push(s);
      const nm=document.createElement('span');
      nm.className='nm';
      nm.textContent=s.name;
      const hint=document.createElement('span');
      hint.className='hint';
      hint.textContent=s.value.replace('§','');
      row.append(nm,hint);
      row.title=s.value.replace('§','');
      row.addEventListener('click',()=>{closeAll();insertAtCursor(s.value);});
      if(s.ci!=null){
        const del=document.createElement('button');
        del.className='del';
        del.textContent='✕';
        del.title='삭제';
        del.addEventListener('click',ev=>{
          ev.stopPropagation();
          if(!confirm(`"${s.name}" 스니펫을 삭제할까?`))return;
          const list=loadCustom();
          list.splice(s.ci,1);
          saveCustom(list);
          renderSnippetList();
        });
        row.appendChild(del);
      }
      body.appendChild(row);
    });
  });
  if(!body.children.length){
    const h=document.createElement('div');
    h.className='emptyHint';
    h.textContent='검색 결과 없음';
    body.appendChild(h);
  }
}
$('snipSearch').addEventListener('input',renderSnippetList);

/* ───────── 배경 / 테스트 ───────── */
let forceColor=false;
let pauseAnim=false;
let checker=false;

function cleanHex(value){
  let v=String(value||'').trim().toLowerCase();
  if(!v)return null;
  if(v[0]!=='#')v='#'+v;
  if(/^#[0-9a-f]{3}$/.test(v))v='#'+v.slice(1).split('').map(ch=>ch+ch).join('');
  return /^#[0-9a-f]{6}$/.test(v)?v:null;
}
function clampByte(value){
  const n=Number(value);
  return Number.isFinite(n)?Math.max(0,Math.min(255,Math.round(n))):0;
}
function hexToRgbTriplet(hex){
  const v=cleanHex(hex);
  if(!v)return null;
  return {r:parseInt(v.slice(1,3),16),g:parseInt(v.slice(3,5),16),b:parseInt(v.slice(5,7),16)};
}
function rgbTripletToHex(r,g,b){
  return '#'+[clampByte(r),clampByte(g),clampByte(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function setColorControls(colorId,hexId,rgbIds,hexValue,onValid){
  const color=$(colorId),hex=$(hexId);
  const v=cleanHex(hexValue)||color.value||'#000000';
  const rgb=hexToRgbTriplet(v);
  color.value=v;
  hex.value=v;
  if(rgbIds&&rgb){$(rgbIds.r).value=rgb.r;$(rgbIds.g).value=rgb.g;$(rgbIds.b).value=rgb.b;}
  if(onValid)onValid(v);
}
function syncColorPair(colorId,hexId,rgbIds,onValid){
  const color=$(colorId),hex=$(hexId);
  const apply=value=>setColorControls(colorId,hexId,rgbIds,value,onValid);
  color.addEventListener('input',()=>apply(color.value));
  hex.addEventListener('input',()=>{const v=cleanHex(hex.value);if(v)apply(v);});
  hex.addEventListener('change',()=>{
    const v=cleanHex(hex.value);
    if(v)apply(v);
    else{hex.value=color.value.toLowerCase();showToast('Hex 형식을 확인해줘');}
  });
  hex.addEventListener('focus',()=>hex.select());
  [rgbIds.r,rgbIds.g,rgbIds.b].map($).forEach(input=>{
    input.addEventListener('input',()=>apply(rgbTripletToHex($(rgbIds.r).value,$(rgbIds.g).value,$(rgbIds.b).value)));
    input.addEventListener('change',()=>{input.value=clampByte(input.value);});
    input.addEventListener('focus',()=>input.select());
  });
}
function saveBg(){
  LS.set('silv_viewer_bg',JSON.stringify({color:$('bgColor').value,img:$('bgImage').value,mode:$('bgMode').value}));

function sendEnv(){
  post({type:'env',force:forceColor,color:$('forceColorInput').value,pause:pauseAnim});

  previewWrap.style.backgroundColor=$('bgColor').value;

    previewWrap.style.backgroundSize=mode==='repeat'?'auto':mode;
    previewWrap.style.backgroundRepeat=mode==='repeat'?'repeat':'no-repeat';
    previewWrap.style.backgroundPosition='center';

    previewWrap.style.backgroundImage='';
  }
  previewWrap.classList.toggle('checker',checker);
  $('checkerBtn').classList.toggle('on',checker);
  sendEnv();
}
syncColorPair('bgColor','bgHex',{r:'bgR',g:'bgG',b:'bgB'},()=>{checker=false;applyPreviewEnv();saveBg();});

/* ---- SIlv 숨김 서명 (zero-width watermark) ----
   화면에 보이는 텍스트 사이사이에 폭이 없는(zero-width) 유니코드 문자로
   제작자 서명을 심어둠. 겉보기엔 아무 표시도 없지만, 콘솔에서
   __verifySIlv() 를 실행하면 숨겨둔 문구가 그대로 복호화되어 나옴.
   → 나중에 원본 여부를 증명할 때 쓸 수 있는 용도. */
const SILV_SIGNATURE='©SIlv · CaveDuck 원작자 서명 · nuu1LEELhX';
function silvZWEncode(str){
  return Array.from(str).map(ch=>{
    const bin=ch.codePointAt(0).toString(2).padStart(16,'0');
    return bin.split('').map(bit=>bit==='0'?'\u200b':'\u200c').join('');
  }).join('\u200d');
}
function silvZWDecode(hidden){
  return hidden.split('\u200d').filter(Boolean).map(chunk=>{
    const bin=Array.from(chunk).map(c=>c==='\u200b'?'0':(c==='\u200c'?'1':'')).join('');
    if(bin.length!==16)return '';
    return String.fromCodePoint(parseInt(bin,2));
  }).join('');
}
function initSilvWatermark(){
  const hidden=silvZWEncode(SILV_SIGNATURE);
  const wm=document.querySelector('.silvWatermark');
  if(wm)wm.appendChild(document.createTextNode(hidden));
  document.title=document.title+hidden;
}
window.__verifySIlv=function(){
  const wm=document.querySelector('.silvWatermark');
  const fromWatermark=wm?silvZWDecode(wm.textContent):'';
  const fromTitle=silvZWDecode(document.title);
  const result=fromWatermark||fromTitle||'(숨김 서명을 찾지 못했어요)';
  console.log('%cSIlv 서명 확인:','color:#7fd9c4;font-weight:700;',result);
  return result;
};
